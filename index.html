<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12110e" />
    <meta name="description" content="Draft 77 is a prompt desk for Local Dream. Short tags, a 75-token budget, and copy buttons for the phone." />
    <title>Draft 77</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #12110e;
        --surface: #221f1a;
        --surface-2: #2c2822;
        --fg: #f3ead7;
        --muted: #c8bba8;
        --primary: #e07a3d;
        --ink: #1a120c;
        --sage: #9fbf86;
        --line: #4a4338;
        --sans: "Outfit", "Avenir Next", system-ui, sans-serif;
        --display: "Fraunces", Georgia, serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--fg); }
      body {
        font-family: var(--sans);
        line-height: 1.45;
        padding: 1.25rem 1rem 5.5rem;
      }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:disabled { opacity: 0.38; cursor: default; }
      :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .kicker {
        margin: 0;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: var(--primary);
      }
      h1 { font-family: var(--display); font-weight: 560; font-size: 2.6rem; margin: 0.15rem 0; }
      h2 { font-family: var(--display); font-weight: 560; font-size: 1.6rem; margin: 0; }
      h3 { margin: 0; font-size: 0.95rem; }
      .lede, .hint, .count, .neg { color: var(--muted); }
      .lede { max-width: 38rem; margin-top: 0.25rem; }
      .layout { display: grid; gap: 1rem; margin-top: 1.25rem; }
      .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .lane, .chip, .ghost, .solid, select, input, textarea {
        border: 1px solid var(--line);
        background: var(--surface-2);
        border-radius: 0.7rem;
      }
      .lane { text-align: left; padding: 0.75rem; min-height: 4.4rem; }
      .lane strong { display: block; }
      .lane span, .slip-head span, summary span { color: var(--muted); font-size: 0.8rem; }
      .lane.on, .chip[aria-pressed="true"] {
        background: var(--primary);
        color: var(--ink);
        border-color: var(--primary);
      }
      .lane.on span { color: var(--ink); }
      .switch { display: flex; gap: 0.7rem; align-items: flex-start; margin: 0.8rem 0; }
      .switch input { width: 1.15rem; height: 1.15rem; margin-top: 0.2rem; accent-color: var(--primary); }
      .group { margin: 1rem 0; }
      .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
      .chip { padding: 0.55rem 0.75rem; min-height: 2.75rem; }
      .field { display: flex; flex-direction: column; gap: 0.35rem; margin: 0.6rem 0; font-size: 0.85rem; color: var(--muted); }
      textarea, input, select { padding: 0.7rem 0.75rem; background: var(--surface); }
      textarea { resize: vertical; }
      .row { display: flex; gap: 0.5rem; align-items: end; }
      .wrap { flex-wrap: wrap; }
      .grow { flex: 1; }
      .fold {
        border-top: 1px solid var(--line);
        padding: 0.35rem 0;
      }
      summary { min-height: 2.75rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; cursor: pointer; }
      .steps { margin: 0.4rem 0 0.8rem; padding-left: 1.2rem; color: var(--muted); }
      .ghost, .solid { min-height: 2.75rem; padding: 0.55rem 0.9rem; }
      .solid { background: var(--primary); color: var(--ink); border-color: var(--primary); font-weight: 600; }
      .ticket {
        border: 1px solid var(--line);
        border-left: 4px solid var(--primary);
        background: var(--surface);
        border-radius: 1.05rem;
        padding: 1rem;
      }
      .slip-head, .weights li, .slips li { display: flex; align-items: center; gap: 0.4rem; }
      .slip-head { justify-content: space-between; }
      .galley { overflow-wrap: anywhere; min-height: 3rem; }
      .meter { height: 0.4rem; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
      .meter span { display: block; height: 100%; background: var(--sage); }
      .meter.over span, .count.over { background: var(--primary); }
      .count.over { background: none; color: var(--primary); }
      .weights { list-style: none; padding: 0; margin: 0.8rem 0; max-height: 16rem; overflow: auto; }
      .weights li span, .slips li span { flex: 1; min-width: 0; }
      .weights button, .slips button {
        min-width: 2.75rem;
        min-height: 2.75rem;
        border: 1px solid var(--line);
        background: var(--surface-2);
        border-radius: 0.55rem;
      }
      .slips { list-style: none; padding: 0; margin: 0.4rem 0 0.8rem; }
      .slips li { margin: 0.35rem 0; }
      .neg { font-size: 0.9rem; }
      .dock {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        display: flex;
        gap: 0.5rem;
        padding: 0.7rem 1rem calc(0.7rem + env(safe-area-inset-bottom));
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        border-top: 1px solid var(--line);
      }
      .dock .solid, .dock .ghost { flex: 1; }
      @media (min-width: 64rem) {
        body { padding: 1.5rem 2rem 2rem; }
        .layout { grid-template-columns: minmax(0, 1fr) 22rem; align-items: start; }
        .ticket { position: sticky; top: 1rem; max-height: calc(100dvh - 2rem); overflow: auto; }
        .dock { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
